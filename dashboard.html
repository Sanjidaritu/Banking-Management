<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upright Bank - Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #0b2a4a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bank-name {
            font-size: 24px;
            font-weight: bold;
        }

        .logout-btn {
            background: white;
            color: #0b2a4a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #e8eef5;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .balance {
            font-size: 34px;
            font-weight: bold;
            color: #0b2a4a;
        }

        .account-number {
            font-size: 18px;
            font-weight: bold;
            margin-top: 8px;
        }

        .account-type {
            color: #6b7280;
            margin-top: 5px;
            text-transform: capitalize;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .bank-name {
                font-size: 20px;
            }

            .container {
                margin-top: 25px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .balance {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="bank-name">
        Upright Bank
    </div>

    <button class="logout-btn" id="logoutBtn">
        Logout
    </button>

</header>


<main class="container">

    <div class="welcome">
        <h1>
            Welcome, <span id="firstName">Customer</span>
        </h1>

        <p>
            Your online banking account
        </p>
    </div>


    <div id="errorMessage" class="error"></div>


    <div id="loading" class="loading">
        Loading account information...
    </div>


    <div id="dashboard" class="cards" style="display:none;">

        <!-- CURRENT BALANCE -->

        <div class="card">

            <div class="card-title">
                Current Balance
            </div>

            <div class="balance" id="currentBalance">
                $0.00
            </div>

        </div>


        <!-- AVAILABLE BALANCE -->

        <div class="card">

            <div class="card-title">
                Available Balance
            </div>

            <div class="balance" id="availableBalance">
                $0.00
            </div>

        </div>


        <!-- ACCOUNT -->

        <div class="card">

            <div class="card-title">
                Account
            </div>

            <div class="account-number" id="accountNumber">
                Loading...
            </div>

            <div class="account-type" id="accountType">
                Loading...
            </div>

        </div>

    </div>

</main>


<script>

    /* =====================================================
       LOAD DASHBOARD
    ===================================================== */

    async function loadDashboard() {

        const loading = document.getElementById("loading");
        const dashboard = document.getElementById("dashboard");
        const errorMessage = document.getElementById("errorMessage");

        try {

            const response = await fetch("/api/dashboard", {
                method: "GET",
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                }
            });


            /*
             * IMPORTANT:
             * Check the response before calling response.json().
             * This prevents:
             *
             * Unexpected token '<'
             *
             * when the server accidentally returns HTML.
             */

            const contentType =
                response.headers.get("content-type") || "";


            if (!contentType.includes("application/json")) {

                const text = await response.text();

                console.error(
                    "Expected JSON but received:",
                    text
                );

                throw new Error(
                    "Server returned HTML instead of JSON."
                );
            }


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Unable to load account."
                );
            }


            /*
             * SERVER RESPONSE
             *
             * Expected example:
             *
             * {
             *   firstName: "Sanjida",
             *   accounts: [
             *     {
             *       accountType: "checking",
             *       accountNumber: "••••2003",
             *       currentBalance: 8450.75,
             *       availableBalance: 8450.75
             *     }
             *   ]
             * }
             */


            document.getElementById("firstName").textContent =
                data.firstName || "Customer";


            /*
             * Get first account.
             */

            const account =
                data.accounts && data.accounts.length > 0
                    ? data.accounts[0]
                    : null;


            if (!account) {

                throw new Error(
                    "No active checking or savings account found."
                );
            }


            /*
             * BALANCE FROM DATABASE
             */

            const currentBalance =
                Number(account.currentBalance || 0);

            const availableBalance =
                Number(account.availableBalance || 0);


            document.getElementById("currentBalance")
                .textContent =
                "$" + currentBalance.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );


            document.getElementById("availableBalance")
                .textContent =
                "$" + availableBalance.toLocaleString(
                    "en-US",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );


            document.getElementById("accountNumber")
                .textContent =
                account.accountNumber || "••••";


            document.getElementById("accountType")
                .textContent =
                account.accountType || "Account";


            loading.style.display = "none";

            dashboard.style.display = "grid";


        } catch (error) {

            console.error(
                "Dashboard error:",
                error
            );

            loading.style.display = "none";

            errorMessage.style.display = "block";

            errorMessage.textContent =
                error.message ||
                "Unable to load account information.";
        }
    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById("logoutBtn")
        .addEventListener("click", async function () {

            try {

                const response = await fetch("/api/logout", {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Accept": "application/json"
                    }

                });


                if (response.ok) {

                    window.location.href =
                        "/login.html";

                    return;
                }


                /*
                 * If logout endpoint returns something
                 * unexpected, still send the user to login.
                 */

                window.location.href =
                    "/login.html";


            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                window.location.href =
                    "/login.html";
            }

        });


    /* =====================================================
       START
    ===================================================== */

    loadDashboard();

</script>

</body>
</html>
