<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upright Bank - Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .topbar {
            background: #123c69;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bank-name {
            font-size: 24px;
            font-weight: bold;
        }

        .logout-button {
            border: none;
            background: white;
            color: #123c69;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background: #eaf0f7;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin: 0 0 8px;
            color: #123c69;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }

        .balance-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .balance-card {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .balance-label {
            color: #6b7280;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .balance {
            color: #123c69;
            font-size: 34px;
            font-weight: bold;
        }

        .account-card {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .account-card h2 {
            margin-top: 0;
            color: #123c69;
        }

        .account-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #6b7280;
        }

        .value {
            font-weight: bold;
            text-align: right;
        }

        .status {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            margin-top: 35px;
            padding-bottom: 30px;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .topbar {
                padding: 16px 18px;
            }

            .bank-name {
                font-size: 20px;
            }

            .container {
                margin-top: 25px;
                padding: 0 15px;
            }

            .balance-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .account-row {
                gap: 15px;
            }

            .value {
                max-width: 55%;
            }

        }

    </style>

</head>

<body>

    <header class="topbar">

        <div class="bank-name">
            Upright Bank
        </div>

        <button
            type="button"
            class="logout-button"
            id="logoutButton"
        >
            Logout
        </button>

    </header>


    <main class="container">

        <div
            id="errorMessage"
            class="error"
        ></div>


        <div
            id="loadingMessage"
            class="loading"
        >
            Loading your account...
        </div>


        <div
            id="dashboardContent"
            style="display: none;"
        >

            <section class="welcome">

                <h1 id="welcomeName">
                    Welcome
                </h1>

                <p>
                    Welcome to your Upright Bank online banking dashboard.
                </p>

            </section>


            <section class="balance-grid">

                <div class="balance-card">

                    <div class="balance-label">
                        Current Balance
                    </div>

                    <div
                        class="balance"
                        id="currentBalance"
                    >
                        $0.00
                    </div>

                </div>


                <div class="balance-card">

                    <div class="balance-label">
                        Available Balance
                    </div>

                    <div
                        class="balance"
                        id="availableBalance"
                    >
                        $0.00
                    </div>

                </div>

            </section>


            <section class="account-card">

                <h2>
                    Account Information
                </h2>


                <div class="account-row">

                    <div class="label">
                        Customer Name
                    </div>

                    <div
                        class="value"
                        id="customerName"
                    >
                        -
                    </div>

                </div>


                <div class="account-row">

                    <div class="label">
                        Username
                    </div>

                    <div
                        class="value"
                        id="username"
                    >
                        -
                    </div>

                </div>


                <div class="account-row">

                    <div class="label">
                        Account Number
                    </div>

                    <div
                        class="value"
                        id="accountNumber"
                    >
                        -
                    </div>

                </div>


                <div class="account-row">

                    <div class="label">
                        Account Type
                    </div>

                    <div
                        class="value"
                        id="accountType"
                    >
                        -
                    </div>

                </div>


                <div class="account-row">

                    <div class="label">
                        Account Status
                    </div>

                    <div class="value">

                        <span
                            class="status"
                            id="accountStatus"
                        >
                            Active
                        </span>

                    </div>

                </div>

            </section>

        </div>


        <div class="footer">
            © 2026 Upright Bank. All rights reserved.
        </div>

    </main>


    <script src="dashboard.js"></script>

</body>

</html>
