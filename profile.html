<!-- =================================================
     CUSTOMER PROFILE
================================================= -->

<section
    class="profile-card"
    id="profileSection"
    style="display: none;"
>

    <div class="profile-header">

        <h2>My Profile</h2>

        <button
            type="button"
            class="profile-button edit-profile-button"
            id="editProfileButton"
        >
            Edit Profile
        </button>

    </div>

    <p class="profile-description">
        Review and update your personal and contact information.
    </p>

    <form id="profileForm">

        <div class="profile-grid">

            <div class="profile-field">
                <label for="profileFirstName">First Name</label>
                <input
                    type="text"
                    id="profileFirstName"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileLastName">Last Name</label>
                <input
                    type="text"
                    id="profileLastName"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileEmail">Email Address</label>
                <input
                    type="email"
                    id="profileEmail"
                    disabled
                >
                <span
                    id="emailVerificationStatus"
                    class="verification-status"
                >
                    Not verified
                </span>
            </div>

            <div class="profile-field">
                <label for="profilePhone">Phone Number</label>
                <input
                    type="tel"
                    id="profilePhone"
                    disabled
                >
                <span
                    id="phoneVerificationStatus"
                    class="verification-status"
                >
                    Not verified
                </span>
            </div>

            <div class="profile-field">
                <label for="profileAddress">Street Address</label>
                <input
                    type="text"
                    id="profileAddress"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileCity">City</label>
                <input
                    type="text"
                    id="profileCity"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileState">State</label>
                <input
                    type="text"
                    id="profileState"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profilePostalCode">Postal Code</label>
                <input
                    type="text"
                    id="profilePostalCode"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileDOB">Date of Birth</label>
                <input
                    type="text"
                    id="profileDOB"
                    disabled
                >
            </div>

            <div class="profile-field">
                <label for="profileSSN">SSN (Last 4 Digits)</label>
                <input
                    type="text"
                    id="profileSSN"
                    disabled
                >
            </div>

        </div>

        <div
            class="profile-actions"
            id="profileActions"
            style="display: none;"
        >

            <button
                type="submit"
                class="profile-button save-profile-button"
            >
                Save Changes
            </button>

            <button
                type="button"
                class="profile-button cancel-profile-button"
                id="cancelProfileButton"
            >
                Cancel
            </button>

        </div>

        <div
            id="profileMessage"
            class="profile-message"
        ></div>

    </form>

</section>
