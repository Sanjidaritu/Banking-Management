<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upright Bank Login</title>
</head>
<style>

/* =====================================================
   UPRIGHT BANK LOGIN
===================================================== */

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    padding: 0;

    font-family: Arial, sans-serif;

    background: #f3f6fa;

    color: #1f2937;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =====================================================
   LOGIN CONTAINER
===================================================== */

body > h2,
body > h3,
body > form {
    position: relative;
}


/* Bank name */

h2 {
    position: absolute;

    top: 35px;
    left: 50%;

    transform: translateX(-50%);

    margin: 0;

    color: #123c69;

    font-size: 30px;
}


/* Page title */

h3 {
    position: absolute;

    top: 82px;
    left: 50%;

    transform: translateX(-50%);

    margin: 0;

    font-size: 18px;

    font-weight: normal;

    color: #64748b;
}


/* =====================================================
   LOGIN FORM
===================================================== */

form {
    width: 380px;

    background: white;

    padding: 35px;

    border-radius: 10px;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
}


/* Labels */

label {
    display: inline-block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;

    color: #334155;
}


/* Inputs */

input {
    width: 100%;

    height: 45px;

    padding: 0 12px;

    border: 1px solid #cbd5e1;

    border-radius: 6px;

    font-size: 15px;

    outline: none;

    transition: border-color 0.2s;
}


input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 2px rgba(37, 99, 235, 0.1);
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

button {
    width: 100%;

    height: 45px;

    border: none;

    border-radius: 6px;

    background: #123c69;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.1s;
}


button:hover {
    background: #0d2f52;
}


button:active {
    transform: scale(0.98);
}


/* =====================================================
   ERROR MESSAGE
===================================================== */

#error {
    margin-top: 15px;

    margin-bottom: 0;

    font-size: 14px;

    text-align: center;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    h2 {
        top: 25px;

        font-size: 26px;
    }


    h3 {
        top: 65px;

        font-size: 16px;
    }


    form {
        width: calc(100% - 30px);

        padding: 25px;
    }

}

</style>
<body>


<h2>Upright Bank</h2>
<h3>Online Banking Login</h3>

<form id="loginForm">

    <label for="username">Username</label><br>
    <input
        type="text"
        id="username"
        name="username"
        required
    >

    <br><br>

    <label for="password">Password</label><br>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">Login</button>

    <p id="error" style="color: red;"></p>

</form>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {

        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const error = document.getElementById("error");

        error.textContent = "";

        if (!username || !password) {
            error.textContent = "Username and password are required.";
            return;
        }

        try {

            const response = await fetch("login.php", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    username: username,
                    password: password
                })

            });

            const data = await response.json();

            if (!response.ok || !data.success) {

                error.textContent =
                    data.message || "Invalid username or password.";

                return;
            }

            // Login successful
            window.location.href = "dashboard.html";

        } catch (err) {

            console.error(err);

            error.textContent =
                "Unable to connect to the login server.";

        }

    });
</script>


</body>
</html>
