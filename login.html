
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upright Bank Login</title>


    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3f6fa;

            color: #1f2937;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

            text-align: center;

        }


        /* =====================================================
           BANK NAME
        ===================================================== */

        .bank-name {

            margin: 0 0 8px 0;

            color: #123c69;

            font-size: 32px;

            font-weight: bold;

        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {

            margin: 0 0 25px 0;

            color: #64748b;

            font-size: 18px;

            font-weight: normal;

        }


        /* =====================================================
           LOGIN FORM
        ===================================================== */

        #loginForm {

            width: 100%;

            background: #ffffff;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08);

            text-align: left;

        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {

            margin-bottom: 20px;

        }


        /* =====================================================
           LABEL
        ===================================================== */

        label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;

        }


        /* =====================================================
           INPUT
        ===================================================== */

        input {

            width: 100%;

            height: 45px;

            padding: 0 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            background: #ffffff;

            color: #1f2937;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.1);

        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        button {

            width: 100%;

            height: 45px;

            border: none;

            border-radius: 6px;

            background: #123c69;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;

        }


        button:hover {

            background: #0d2f52;

        }


        button:active {

            transform: scale(0.98);

        }


        /* =====================================================
           ERROR MESSAGE
        ===================================================== */

        #error {

            min-height: 18px;

            margin: 15px 0 0 0;

            color: #dc2626;

            font-size: 14px;

            text-align: center;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            body {

                align-items: flex-start;

                padding-top: 50px;

            }


            .login-container {

                padding: 15px;

            }


            .bank-name {

                font-size: 28px;

            }


            .page-title {

                font-size: 16px;

                margin-bottom: 20px;

            }


            #loginForm {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <h2 class="bank-name">
            Upright Bank
        </h2>


        <h3 class="page-title">
            Online Banking Login
        </h3>


        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>


            <p id="error"></p>


        </form>


    </div>


    <script>


        /* =====================================================
           LOGIN
        ===================================================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(e) {

                    e.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const error =
                        document
                            .getElementById("error");


                    error.textContent = "";


                    /* Validate fields */

                    if (!username || !password) {

                        error.textContent =
                            "Username and password are required.";

                        return;

                    }


                    try {


                        /* Send login request to PHP */

                        const response =
                            await fetch(
                                "login.php",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    credentials: "include",

                                    body:
                                        JSON.stringify({

                                            username:
                                                username,

                                            password:
                                                password

                                        })

                                }
                            );


                        /* Read response */

                        const data =
                            await response.json();


                        /* Login failed */

                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            error.textContent =
                                data.message ||
                                "Invalid username or password.";

                            return;

                        }


                        /* Login successful */

                        window.location.href =
                            "dashboard.html";


                    } catch (err) {

                        console.error(
                            "Login error:",
                            err
                        );


                        error.textContent =
                            "Unable to connect to the login server.";

                    }

                }
            );

    </script>


</body>

</html>
